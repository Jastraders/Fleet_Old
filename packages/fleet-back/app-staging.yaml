runtime: python311
service: staging
entrypoint: gunicorn -b :$PORT app:app

instance_class: F1

env_variables:
  ALLOWED_ORIGINS: "https://staging.jasfleet.cloud,https://staging-api.jasfleet.cloud,https://fleet-staging.web.app,https://staging-dot-fleet-494408.el.r.appspot.com,http://localhost:3000"

automatic_scaling:
  min_instances: 0
  max_instances: 1
  target_cpu_utilization: 0.8

handlers:
- url: /.*
  script: auto
