name: Deploy Backend Staging (App Engine)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure gcloud project
        run: gcloud config set project "${{ secrets.GCP_PROJECT }}"

      - name: Install YAML tooling
        run: python -m pip install PyYAML

      - name: Validate Staging Database Secret
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$STAGING_URL" ]; then
            echo "::error::STAGING_SUPABASE_DATABASE_URL is missing."
            exit 1
          fi

          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = urlparse(os.environ["STAGING_URL"])
          if (
              url.scheme not in ("postgres", "postgresql")
              or not url.hostname
              or url.path != "/postgres"
          ):
              raise SystemExit("Invalid staging database URL format.")
          PY

      - name: Deploy Staging to App Engine
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("app-staging.yaml")
          config = yaml.safe_load(path.read_text())
          config.setdefault("env_variables", {})["SUPABASE_DATABASE_URL"] = os.environ["STAGING_URL"]

          path.write_text(yaml.safe_dump(config, sort_keys=False))
          PY

          gcloud app deploy app-staging.yaml --quiet
        working-directory: packages/fleet-back

      - name: Diagnostic on Failure
        if: failure()
        run: |
          gcloud app logs read --service=staging --limit=50 || true

      - name: Deploy dispatch routing
        run: gcloud app deploy dispatch.yaml --quiet