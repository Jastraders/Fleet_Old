name: Deploy Backend Staging (App Engine)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure gcloud project
        run: gcloud config set project ${{ secrets.GCP_PROJECT }}

      - name: Inject Staging Database Secret
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_DATABASE_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            sed -i "s|postgresql://postgres:hamdan4040!@db.gpqkhbctrtvopqvxlahe.supabase.co:5432/postgres|${STAGING_URL}|g" packages/fleet-back/app-staging.yaml
          fi

      - name: Deploy Staging to App Engine
        run: gcloud app deploy app-staging.yaml --quiet
        working-directory: packages/fleet-back

      - name: Deploy dispatch routing
        run: gcloud app deploy dispatch.yaml --quiet



        